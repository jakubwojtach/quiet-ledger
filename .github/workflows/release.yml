name: Release builds

on:
  workflow_dispatch:
  push:
    branches: [master, main]
    tags:
      - 'v*'

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: true

jobs:
  mac:
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Set release version
        run: |
          if [[ "${GITHUB_REF}" == refs/tags/v* ]]; then
            VER="${GITHUB_REF_NAME#v}"
          else
            VER="1.0.${GITHUB_RUN_NUMBER}"
          fi
          export VER
          node -e "const fs=require('fs');const p=JSON.parse(fs.readFileSync('package.json','utf8'));p.version=process.env.VER;fs.writeFileSync('package.json',JSON.stringify(p,null,2)+'\n')"
          echo "Building Quiet Ledger v${VER}"
      - run: npm ci
      - run: npm run typecheck
      - name: Build signed macOS
        env:
          CSC_LINK: ${{ secrets.CSC_LINK }}
          CSC_KEY_PASSWORD: ${{ secrets.CSC_KEY_PASSWORD }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          if [ -z "${CSC_LINK}" ]; then
            echo "::warning::CSC_LINK secret missing — building unsigned macOS (auto-update will not work on Mac)."
            export CSC_IDENTITY_AUTO_DISCOVERY=false
          else
            echo "Signing with Developer ID from CSC_LINK"
            export CSC_IDENTITY_AUTO_DISCOVERY=true
          fi
          npm run build:mac
      - name: Verify signature
        env:
          CSC_LINK: ${{ secrets.CSC_LINK }}
        run: |
          if [ -z "${CSC_LINK}" ]; then
            echo "No CSC_LINK — skip signature verify"
            exit 0
          fi
          APP=$(ls -d dist/mac-arm64/Quiet\ Ledger.app dist/mac/Quiet\ Ledger.app dist/mac*/Quiet\ Ledger.app 2>/dev/null | head -1)
          if [ -z "$APP" ]; then
            echo "App bundle not found under dist/"
            ls -la dist || true
            exit 1
          fi
          codesign --verify --deep --strict --verbose=2 "$APP"
          spctl --assess --type execute --verbose=4 "$APP" || true
          echo "Signed OK: $APP"
      - name: Stable download aliases
        run: |
          cd dist
          dmg=$(ls -1 *.dmg | head -1)
          zip=$(ls -1 *.zip | head -1)
          cp "$dmg" quiet-ledger-mac.dmg
          cp "$zip" quiet-ledger-mac.zip
      - uses: actions/upload-artifact@v4
        with:
          name: quiet-ledger-mac
          path: |
            dist/*.dmg
            dist/*.zip
            dist/*.yml
            dist/*.blockmap
          if-no-files-found: error

  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Set release version
        shell: bash
        run: |
          if [[ "${GITHUB_REF}" == refs/tags/v* ]]; then
            VER="${GITHUB_REF_NAME#v}"
          else
            VER="1.0.${GITHUB_RUN_NUMBER}"
          fi
          export VER
          node -e "const fs=require('fs');const p=JSON.parse(fs.readFileSync('package.json','utf8'));p.version=process.env.VER;fs.writeFileSync('package.json',JSON.stringify(p,null,2)+'\n')"
          echo "Building Quiet Ledger v${VER}"
      - run: npm ci
      - run: npm run typecheck
      - name: Build Windows
        shell: bash
        env:
          WIN_CSC_LINK: ${{ secrets.WIN_CSC_LINK }}
          WIN_CSC_KEY_PASSWORD: ${{ secrets.WIN_CSC_KEY_PASSWORD }}
          CSC_IDENTITY_AUTO_DISCOVERY: false
        run: |
          if [ -n "${WIN_CSC_LINK}" ]; then
            export CSC_LINK="${WIN_CSC_LINK}"
            export CSC_KEY_PASSWORD="${WIN_CSC_KEY_PASSWORD}"
            echo "Signing Windows build with WIN_CSC_LINK"
          else
            echo "WIN_CSC_LINK not set — unsigned Windows build"
          fi
          npm run build:win
      - name: Stable download aliases
        shell: bash
        run: |
          cd dist
          setup=$(ls -1 *-setup.exe 2>/dev/null | head -1 || ls -1 *.exe | head -1)
          cp "$setup" quiet-ledger-win-setup.exe
      - uses: actions/upload-artifact@v4
        with:
          name: quiet-ledger-windows
          path: |
            dist/*.exe
            dist/*.yml
            dist/*.blockmap
          if-no-files-found: error

  publish:
    needs: [mac, windows]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
      - name: Resolve tag
        id: meta
        run: |
          if [[ "${GITHUB_REF}" == refs/tags/v* ]]; then
            TAG="${GITHUB_REF_NAME}"
          else
            TAG="v1.0.${GITHUB_RUN_NUMBER}"
          fi
          echo "tag=${TAG}" >> "$GITHUB_OUTPUT"
          echo "Publishing ${TAG}"
          find artifacts -type f | sort
      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.meta.outputs.tag }}
          name: Quiet Ledger ${{ steps.meta.outputs.tag }}
          generate_release_notes: true
          make_latest: true
          files: |
            artifacts/quiet-ledger-mac/*
            artifacts/quiet-ledger-windows/*
