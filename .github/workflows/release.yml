name: Release builds

on:
  workflow_dispatch:
  push:
    branches: [master, main]
    tags:
      - 'v*'

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # Semver — not GitHub Actions run numbers.
  # - git tag v1.2.3 → build 1.2.3
  # - push master, no tags yet → 1.0.0
  # - push master, latest tag v1.0.0 → 1.0.1
  version:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.meta.outputs.version }}
      tag: ${{ steps.meta.outputs.tag }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - id: meta
        run: |
          set -euo pipefail
          git fetch --tags --force

          if [[ "${GITHUB_REF}" == refs/tags/v* ]]; then
            VER="${GITHUB_REF_NAME#v}"
          else
            LATEST=$(git tag -l 'v*' | sed 's/^v//' | grep -E '^[0-9]+\.[0-9]+\.[0-9]+$' | sort -V | tail -1 || true)
            if [[ -z "${LATEST}" ]]; then
              VER="1.0.0"
            else
              IFS=. read -r MA MI PA <<< "${LATEST}"
              VER="${MA}.${MI}.$((PA + 1))"
            fi
          fi

          if [[ ! "${VER}" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "::error::Invalid version: ${VER}"
            exit 1
          fi

          echo "version=${VER}" >> "$GITHUB_OUTPUT"
          echo "tag=v${VER}" >> "$GITHUB_OUTPUT"
          echo "Release version: v${VER}"

  mac:
    needs: version
    runs-on: macos-14
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Set package version
        run: |
          VER="${{ needs.version.outputs.version }}"
          export VER
          node -e "const fs=require('fs');const p=JSON.parse(fs.readFileSync('package.json','utf8'));p.version=process.env.VER;fs.writeFileSync('package.json',JSON.stringify(p,null,2)+'\n')"
          echo "Building Quiet Ledger v${VER}"
      - run: npm ci
      - run: npm run typecheck
      - name: Build & sign macOS app
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          CSC_LINK: ${{ secrets.CSC_LINK }}
          CSC_KEY_PASSWORD: ${{ secrets.CSC_KEY_PASSWORD }}
        run: |
          if [ -z "${CSC_LINK}" ]; then
            echo "::error::CSC_LINK secret missing — cannot ship a signed Mac build."
            exit 1
          fi
          echo "Signing with Developer ID from CSC_LINK"
          export CSC_IDENTITY_AUTO_DISCOVERY=true
          npm run build:mac
      - name: Notarize with Apple (notarytool)
        timeout-minutes: 35
        env:
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          CSC_LINK: ${{ secrets.CSC_LINK }}
          CSC_KEY_PASSWORD: ${{ secrets.CSC_KEY_PASSWORD }}
        run: bash scripts/notarize-mac.sh
      - name: Verify signature + staple
        run: |
          APP=$(ls -d dist/mac-arm64/Quiet\ Ledger.app dist/mac/Quiet\ Ledger.app dist/mac*/Quiet\ Ledger.app 2>/dev/null | head -1)
          codesign --verify --deep --strict --verbose=2 "$APP"
          spctl --assess --type execute --verbose=4 "$APP" || true
          xcrun stapler validate "$APP"
          echo "Signed + notarized OK: $APP"
      - name: Stable download aliases
        run: |
          cd dist
          dmg=$(ls -1 *.dmg | head -1)
          zip=$(ls -1 *.zip | head -1)
          cp "$dmg" quiet-ledger-mac.dmg
          cp "$zip" quiet-ledger-mac.zip
          ls -la *.dmg *.zip *.yml 2>/dev/null || ls -la
      - uses: actions/upload-artifact@v4
        with:
          name: quiet-ledger-mac
          path: |
            dist/*.dmg
            dist/*.zip
            dist/*.yml
            dist/*.blockmap
          if-no-files-found: error

  windows:
    needs: version
    runs-on: windows-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Set package version
        shell: bash
        run: |
          VER="${{ needs.version.outputs.version }}"
          export VER
          node -e "const fs=require('fs');const p=JSON.parse(fs.readFileSync('package.json','utf8'));p.version=process.env.VER;fs.writeFileSync('package.json',JSON.stringify(p,null,2)+'\n')"
          echo "Building Quiet Ledger v${VER}"
      - run: npm ci
      - run: npm run typecheck
      - name: Build Windows
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          WIN_CSC_LINK: ${{ secrets.WIN_CSC_LINK }}
          WIN_CSC_KEY_PASSWORD: ${{ secrets.WIN_CSC_KEY_PASSWORD }}
          CSC_IDENTITY_AUTO_DISCOVERY: false
        run: |
          if [ -n "${WIN_CSC_LINK}" ]; then
            export CSC_LINK="${WIN_CSC_LINK}"
            export CSC_KEY_PASSWORD="${WIN_CSC_KEY_PASSWORD}"
            echo "Signing Windows build with WIN_CSC_LINK"
          else
            echo "WIN_CSC_LINK not set — unsigned Windows build"
          fi
          npm run build:win
      - name: Stable download aliases
        shell: bash
        run: |
          cd dist
          setup=$(ls -1 *-setup.exe 2>/dev/null | head -1 || ls -1 *.exe | head -1)
          cp "$setup" quiet-ledger-win-setup.exe
      - uses: actions/upload-artifact@v4
        with:
          name: quiet-ledger-windows
          path: |
            dist/*.exe
            dist/*.yml
            dist/*.blockmap
          if-no-files-found: error

  publish:
    needs: [version, mac, windows]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ needs.version.outputs.tag }}
          name: Quiet Ledger ${{ needs.version.outputs.tag }}
          generate_release_notes: true
          make_latest: true
          files: |
            artifacts/quiet-ledger-mac/*
            artifacts/quiet-ledger-windows/*
