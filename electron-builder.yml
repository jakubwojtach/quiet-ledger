appId: com.quietledger.app
productName: Quiet Ledger
directories:
  buildResources: build
files:
  - '!**/.vscode/*'
  - '!src/*'
  - '!electron.vite.config.{js,ts,mjs,cjs}'
  - '!{.eslintcache,eslint.config.mjs,.prettierignore,.prettierrc.yaml,dev-app-update.yml,CHANGELOG.md,README.md}'
  - '!{.env,.env.*,.npmrc,pnpm-lock.yaml}'
  - '!{tsconfig.json,tsconfig.node.json,tsconfig.web.json}'
asarUnpack:
  - resources/**
win:
  executableName: quiet-ledger
nsis:
  artifactName: ${name}-${version}-setup.${ext}
  shortcutName: ${productName}
  uninstallDisplayName: ${productName}
  createDesktopShortcut: always
mac:
  category: public.app-category.finance
  hardenedRuntime: true
  gatekeeperAssess: false
  entitlements: build/entitlements.mac.plist
  entitlementsInherit: build/entitlements.mac.plist
  # Sign in electron-builder; notarize in scripts/notarize-mac.sh (notarytool --wait)
  # so CI logs show Apple submission progress instead of a silent hang.
  notarize: false
  target:
    - dir

  extendInfo:
    NSDocumentsFolderUsageDescription: Quiet Ledger stores optional exports you choose to save.
    NSDownloadsFolderUsageDescription: Quiet Ledger may save downloads you request.
dmg:
  artifactName: ${name}-${version}.${ext}
  sign: true
linux:
  target:
    - AppImage
    - snap
    - deb
  maintainer: electronjs.org
  category: Utility
appImage:
  artifactName: ${name}-${version}.${ext}
npmRebuild: false
publish:
  provider: github
  owner: jakubwojtach
  repo: quiet-ledger
  releaseType: release
